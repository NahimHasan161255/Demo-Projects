<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DAT File Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.2.0/encoding.min.js"></script>
<style>
body{font-family:Arial,sans-serif;margin:20px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid #ccc;padding:6px;white-space:nowrap}
th{background:#1976d2;color:#fff;position:sticky;top:0}
tbody tr:nth-child(even){background:#f5f5f5}
.table-container{overflow:auto;max-height:700px;border:1px solid #ccc}
</style>
</head>
<body>
<h2>Steel DAT File Viewer</h2>
<input type="file" id="fileInput" accept=".dat">
<div class="table-container"><table id="dataTable"></table></div>
<script>
document.getElementById("fileInput").addEventListener("change", e=>{
 const file=e.target.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=ev=>{
  const bytes=new Uint8Array(ev.target.result);
  const unicode=Encoding.convert(bytes,{to:'UNICODE',from:'AUTO'});
  const text=Encoding.codeToString(unicode);
  showTable(text);
 };
 reader.readAsArrayBuffer(file);
});
function showTable(text){
 const table=document.getElementById("dataTable");
 table.innerHTML="";
 const rows=text.split(/\r?\n/).filter(r=>r.trim()!="");
 if(!rows.length)return;
 let max=0;
 const data=rows.map(r=>{const c=r.split(","); if(c.length>max)max=c.length; return c;});
 const thead=document.createElement("thead");
 const hr=document.createElement("tr");
 for(let i=0;i<max;i++){const th=document.createElement("th"); th.textContent="Column "+(i+1); hr.appendChild(th);}
 thead.appendChild(hr); table.appendChild(thead);
 const tbody=document.createElement("tbody");
 data.forEach(r=>{
   const tr=document.createElement("tr");
   for(let i=0;i<max;i++){const td=document.createElement("td"); td.textContent=r[i]||""; tr.appendChild(td);}
   tbody.appendChild(tr);
 });
 table.appendChild(tbody);
}
</script>
</body>
</html>
